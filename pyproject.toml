[project]
name = "warmstart"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=2.3.0",
    "boto3>=1.43.118",
    "matplotlib>=3.11.2",
    "pyarrow>=26.0.0",
    "redis>=8.1.0",
    "typesafe-sdk>=0.7.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
